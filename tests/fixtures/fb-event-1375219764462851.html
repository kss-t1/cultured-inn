ate 3. Sam motyw przewodni stawia na klimat Frieren: m\u0142ode pokolenie poszukiwaczy przyg\u00f3d styka si\u0119 ze starym i w tym g\u0105szczu r\u00f3\u017cnych oczekiwa\u0144, pojawia si\u0119 iskierka nadziei. Jest to larp na 24 postaci (12 klas x2), 3-aktowy, gdzie gracze bior\u0105 udzia\u0142 w cz\u0119\u015bciowej kreacji postaci (relacje i motywacje).\n\nAutorstwo i prowadzenie: Gabriela Kruszona\nD\u0142ugo\u015b\u0107 trwania (warsztaty + gra): 4h\nCena: 165z\u0142, jest w to wliczona sala, ciep\u0142y posi\u0142ek oraz fotograf\nZapisy: poprzez formularz microsoftu. Ze wzgl\u0119du na okres wakacyjny, b\u0119dzie on otwarty ca\u0142y lipiec. Maile z propozycjami postaci zostan\u0105 rozes\u0142ane w ci\u0105gu pierwszego tygodnia, a na potwierdzenie postaci b\u0119dzie dwa tygodnie. \n\nW formularzu b\u0119d\u0105 pytania na temat trigger\u00f3w i w\u0105tk\u00f3w z mo\u017cliwo\u015bci\u0105 wskazania preferowanej klasy, ale ze wzgl\u0119du na specyfik\u0119 gry, nie b\u0119dzie typowej listy postaci.\n\nP\u0142atno\u015b\u0107: w jednej racie, w ci\u0105gu 28 dni od otrzymania maila z propozycj\u0105 postaci.","delight_ranges":[],"image_ranges":[],"inline_style_ranges":[],"aggregated_ranges":[],"ranges":[],"color_ranges":[]},"creation_story":{"click_tracking_linkshim_cb":"AUD-2pUBwk6vuZKzf2TacHLoTzVqY37tKueHm7RG6uHiZ22UNgKMme_MossxqhTfy0gwDT2_d3jNHkKyk-vb_7ZtiJorFAnIUnjxcbDfrerCL9yle73x4wOoZvoknOtPOfkyPVaYFrpTuy03OOWEI5NVUqkbYWf99RI","encrypted_click_tracking":"AZgSJ3rv-b4Q4LuzD-U0ZwDBmS8zvqLIGX-qYvoEyQVsGoMeBgnbcuiutwhSHR4Gui7cCs1dPZT6T5i7NDv5V2SFGC5cGjfxmnnay7m48PmZu0bd3-VZeXAZ7lIoKc0JY-Xo","encrypted_tracking":"AZjWJa5OddsXbIPZA7TDNf8vZ_clH6r1kqw-RushlphSYDVbpea1t0hSDRp3jUeVIJawDwC6EL2nGqpbWuteLm1s8xN3WgmOkV-6LfzjReeMT-DpTMo9h4ZQruEwEUauy_OyTxhlgRyt7EVVfniy9giZx49m7E4JcMqcs5O_6V6NsQD0lLTADR1e127d8dQSvUl9MW3TJCuqrsFoM0YDzu9vO8AKQqr_EcEF-EoTbvlzNCSUWRGTSW_cyJs-Z-MbEHTMbitKbf6NcVBV-S1v4xeQbphco2CdKFlp2e3YDHddZnv451jrziRcPJxyiDx8fQtvFGk-HV-MpCL_R1ZUvYo
